<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>记账本</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 底部导航 -->
    <nav class="bottom-nav">
        <div class="nav-item active" data-page="home">
            <span class="nav-icon">📝</span>
            <span class="nav-label">记账</span>
        </div>
        <div class="nav-item" data-page="stats">
            <span class="nav-icon">📊</span>
            <span class="nav-label">统计</span>
        </div>
        <div class="nav-item" data-page="milktea">
            <span class="nav-icon">🧋</span>
            <span class="nav-label">奶茶</span>
        </div>
        <div class="nav-item" data-page="settings">
            <span class="nav-icon">⚙️</span>
            <span class="nav-label">设置</span>
        </div>
    </nav>

    <!-- 记账页 -->
    <div class="page active" id="page-home">
        <header class="page-header">
            <h1>记账本</h1>
            <div class="month-summary" id="month-summary"></div>
        </header>
        <div class="card add-record-card">
            <div class="type-toggle">
                <button class="toggle-btn active" data-type="expense">支出</button>
                <button class="toggle-btn" data-type="income">收入</button>
            </div>
            <div class="form-group">
                <input type="number" id="amount" placeholder="金额" step="0.01" inputmode="decimal">
            </div>
            <div class="form-group">
                <div class="category-grid" id="category-grid"></div>
            </div>
            <div class="form-group">
                <input type="date" id="record-date">
            </div>
            <div class="form-group">
                <input type="text" id="note" placeholder="备注（选填）">
            </div>
            <button class="btn-primary" id="btn-add">记一笔</button>
        </div>
        <div class="card">
            <h3>最近记录</h3>
            <div class="record-list" id="record-list"></div>
        </div>
    </div>

    <!-- 统计页 -->
    <div class="page" id="page-stats">
        <header class="page-header">
            <h1>统计</h1>
            <div class="month-picker">
                <button id="prev-month">◀</button>
                <span id="current-month"></span>
                <button id="next-month">▶</button>
            </div>
        </header>
        <div class="card">
            <div class="stats-summary" id="stats-summary"></div>
        </div>
        <div class="card">
            <h3>支出分类</h3>
            <div class="chart-container">
                <canvas id="pie-chart"></canvas>
            </div>
        </div>
        <div class="card">
            <h3>每日趋势</h3>
            <div class="chart-container">
                <canvas id="bar-chart"></canvas>
            </div>
        </div>
    </div>

    <!-- 奶茶页 -->
    <div class="page" id="page-milktea">
        <header class="page-header">
            <h1>🧋 奶茶日记</h1>
            <div class="milktea-stats" id="milktea-stats"></div>
        </header>
        <div class="card">
            <div class="form-group">
                <input type="date" id="tea-date">
            </div>
            <div class="form-group">
                <input type="text" id="tea-brand" placeholder="品牌（如：喜茶、瑞幸）">
            </div>
            <div class="form-group">
                <input type="text" id="tea-name" placeholder="饮品名称">
            </div>
            <div class="form-group">
                <input type="number" id="tea-price" placeholder="价格" step="0.01" inputmode="decimal">
            </div>
            <div class="form-group">
                <div class="rating-input" id="tea-rating">
                    <span class="star" data-val="1">☆</span>
                    <span class="star" data-val="2">☆</span>
                    <span class="star" data-val="3">☆</span>
                    <span class="star" data-val="4">☆</span>
                    <span class="star" data-val="5">☆</span>
                </div>
            </div>
            <button class="btn-primary" id="btn-add-tea">记一杯</button>
        </div>
        <div class="card">
            <h3>奶茶记录</h3>
            <div class="record-list" id="tea-list"></div>
        </div>
    </div>

    <!-- 设置页 -->
    <div class="page" id="page-settings">
        <header class="page-header">
            <h1>设置</h1>
        </header>
        <div class="card">
            <h3>Supabase 连接</h3>
            <div class="form-group">
                <label>Project URL</label>
                <input type="text" id="supabase-url" placeholder="https://xxx.supabase.co">
            </div>
            <div class="form-group">
                <label>Anon Key</label>
                <input type="text" id="supabase-key" placeholder="eyJhbGciOi...">
            </div>
            <button class="btn-primary" id="btn-save-config">保存连接</button>
            <div class="connection-status" id="connection-status"></div>
        </div>
        <div class="card">
            <h3>自定义分类</h3>
            <div class="form-group">
                <div class="custom-category-row">
                    <select id="custom-cat-type">
                        <option value="expense">支出</option>
                        <option value="income">收入</option>
                    </select>
                    <input type="text" id="custom-cat-name" placeholder="分类名称">
                    <button class="btn-small" id="btn-add-category">+</button>
                </div>
            </div>
            <div id="custom-categories-list"></div>
        </div>
        <div class="card">
            <h3>数据管理</h3>
            <button class="btn-secondary" id="btn-export">导出数据 (JSON)</button>
            <button class="btn-danger" id="btn-clear">清空所有数据</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
